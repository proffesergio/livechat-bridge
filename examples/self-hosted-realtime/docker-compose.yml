# Self-hosted realtime for livechat-bridge — zero SaaS.
#
# Runs Sockudo (a Rust, Pusher-protocol-compatible WebSocket server) backed by
# Redis for horizontal fan-out. Because Sockudo speaks the Pusher protocol, you
# keep using `PusherTransport` (server) and `pusher-js` (client) unchanged —
# only the host/port config differs from Pusher SaaS.
#
# This is one of two self-hosting options. The other needs no WebSocket server
# at all: see the SSE transport ("Realtime transports" in LiveChatSupport.md).
#
# NOTE: verify the image tag and the exact config keys against the current
# Sockudo docs (https://sockudo.io) before deploying — the project is young and
# option names may shift between releases.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # Not published to the host by default — only Sockudo needs it.

  sockudo:
    image: ghcr.io/sockudo/sockudo:latest
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - '6001:6001' # Pusher-protocol WebSocket + HTTP API
    volumes:
      - ./sockudo.config.json:/app/config.json:ro
    command: ['--config', '/app/config.json']

volumes:
  redis-data:
